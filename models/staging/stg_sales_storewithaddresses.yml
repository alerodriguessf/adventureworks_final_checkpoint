
version: 2

sources:
  - name: databricks_dw_aw
    database: "{{ env_var('DATABRICKS_CATALOG') }}"
    schema: "{{ env_var('DATABRICKS_SCHEMA_RAW') }}"
    tables:
      - name: raw_sqlserver_sales_vstorewithaddresses_db
        loaded_at_field: ModifiedDate

models: 
  - name: stg_sales_storewithaddresses
    description: "Tabela com a relação de lojas de vendas e seus endereços"
    Columns:
      - name: business_entity_id
        description: "ID da entidade comercial da loja"
      - name: store_name
        description: "Nome da loja"
      - name: address_type
        description: "Tipo de endereço (ex: Billing, Shipping)"
      - name: address_line_1
        description: "Linha 1 do endereço"
      - name: address_line_2
        description: "Linha 2 do endereço"
      - name: city
        description: "Cidade do endereço"
      - name: state_province_name
        description: "Nome do estado ou província"
      - name: postal_code
        description: "Código postal do endereço"
      - name: country_region_name
        description: "Nome do país ou região"